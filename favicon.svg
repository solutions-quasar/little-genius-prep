<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.75"/>

  <!-- Academy Shield -->
  <path d="M32 9 L48 15 C48 30 41 44 32 53 C23 44 16 30 16 15 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Academic Knowledge Torch / Crest Symbol -->
  <!-- Lamp / Bowl -->
  <path d="M25 35 C25 39 39 39 39 35 L41 33 H23 Z" fill="url(#goldGrad)"/>
  <!-- Stem & Base -->
  <path d="M30 37 L30 42 L26 44 H38 L34 42 L34 37 Z" fill="url(#goldGrad)"/>
  <!-- Flame of Wisdom -->
  <path d="M32 20 C34 23 37 25 35 29 C34 31 32 32 32 32 C32 32 30 31 29 29 C27 25 30 23 32 20 Z" fill="#FCD34D"/>
  <circle cx="32" cy="27" r="2" fill="#FFFFFF"/>
</svg>
